# K8s Job template for batch execution.
# Variables (envsubst): PROJECT_ID, JOB_NAME, HOST_UID, HOST_GID,
#                       CONTAINER_IMAGE, GPU_COUNT, JOB_COMMAND,
#                       ZEPHYR_PROJECTS_ROOT, ZEPHYR_SHARED_ROOT, ZEPHYR_BUILD_ROOT,
#                       SYGALDRY_HOME
apiVersion: batch/v1
kind: Job
metadata:
  name: sygaldry-job-${PROJECT_ID}-${JOB_NAME}
  namespace: sygaldry
  labels:
    app: sygaldry
    sygaldry/component: job
    sygaldry/project-id: "${PROJECT_ID}"
    sygaldry/job-name: "${JOB_NAME}"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: sygaldry
        sygaldry/component: job
        sygaldry/project-id: "${PROJECT_ID}"
        sygaldry/job-name: "${JOB_NAME}"
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never
      hostNetwork: true
      hostIPC: true
      terminationGracePeriodSeconds: 5

      securityContext:
        runAsUser: ${HOST_UID}
        runAsGroup: ${HOST_GID}
        fsGroup: ${HOST_GID}

      containers:
        - name: job
          image: "${CONTAINER_IMAGE}"
          imagePullPolicy: Never
          resources:
            limits:
              nvidia.com/gpu: "${GPU_COUNT}"
          envFrom:
            - configMapRef:
                name: sygaldry-env
          env:
            - name: SYGALDRY_PROJECT_ID
              value: "${PROJECT_ID}"
            - name: SYGALDRY_RUN_ID
              value: "${JOB_NAME}"
            - name: SYGALDRY_ROOT
              value: "/workspace"
          command: ["/opt/container_entrypoints/run-job.sh"]
          args: ["bash", "-c", "${JOB_COMMAND}"]
          workingDir: /workspace

          volumeMounts:
            # Per-project mounts
            - name: home
              mountPath: /home/kvothe
            - name: config
              mountPath: /home/kvothe/.config
            - name: local-share
              mountPath: /home/kvothe/.local/share
            - name: outputs
              mountPath: /workspace/outputs
            - name: workspace
              mountPath: /workspace

            # Shared cache mounts
            - name: hf-cache
              mountPath: /opt/hf_cache
            - name: uv-cache
              mountPath: /opt/uv_cache
            - name: bazel-cache
              mountPath: /opt/bazel_cache
            - name: torch-cache
              mountPath: /opt/torch_cache
            - name: triton-cache
              mountPath: /opt/triton_cache
            - name: nv-compute-cache
              mountPath: /opt/nv_compute_cache
            - name: jax-cache
              mountPath: /opt/jax_cache

            # Spack store (read-only)
            - name: spack-store
              mountPath: /opt/spack_store
              readOnly: true

            # Sygaldry repo entrypoints + lib (read-only)
            - name: sygaldry-repo
              mountPath: /opt/container_entrypoints
              subPath: container/entrypoints
              readOnly: true
            - name: sygaldry-repo
              mountPath: /opt/spack_env/entrypoints
              subPath: container/entrypoints
              readOnly: true
            - name: sygaldry-repo
              mountPath: /opt/spack_env/default
              subPath: pkg/zephyr
              readOnly: true
            - name: sygaldry-repo
              mountPath: /opt/lib
              subPath: container/lib
              readOnly: true
            - name: sygaldry-repo
              mountPath: /opt/spack_env/lib
              subPath: container/lib
              readOnly: true

      volumes:
        # Per-project
        - name: home
          hostPath:
            path: ${ZEPHYR_PROJECTS_ROOT}/${PROJECT_ID}/home
            type: DirectoryOrCreate
        - name: config
          hostPath:
            path: ${ZEPHYR_PROJECTS_ROOT}/${PROJECT_ID}/config
            type: DirectoryOrCreate
        - name: local-share
          hostPath:
            path: ${ZEPHYR_PROJECTS_ROOT}/${PROJECT_ID}/local_share
            type: DirectoryOrCreate
        - name: outputs
          hostPath:
            path: ${ZEPHYR_PROJECTS_ROOT}/${PROJECT_ID}/outputs
            type: DirectoryOrCreate
        - name: workspace
          hostPath:
            path: ${ZEPHYR_PROJECTS_ROOT}/${PROJECT_ID}/workspace
            type: DirectoryOrCreate

        # Shared caches
        - name: hf-cache
          hostPath:
            path: ${ZEPHYR_SHARED_ROOT}/hf_cache
            type: DirectoryOrCreate
        - name: uv-cache
          hostPath:
            path: ${ZEPHYR_SHARED_ROOT}/uv_cache
            type: DirectoryOrCreate
        - name: bazel-cache
          hostPath:
            path: ${ZEPHYR_SHARED_ROOT}/bazel_cache
            type: DirectoryOrCreate
        - name: torch-cache
          hostPath:
            path: ${ZEPHYR_SHARED_ROOT}/torch_cache
            type: DirectoryOrCreate
        - name: triton-cache
          hostPath:
            path: ${ZEPHYR_SHARED_ROOT}/triton_cache
            type: DirectoryOrCreate
        - name: nv-compute-cache
          hostPath:
            path: ${ZEPHYR_SHARED_ROOT}/nv_compute_cache
            type: DirectoryOrCreate
        - name: jax-cache
          hostPath:
            path: ${ZEPHYR_SHARED_ROOT}/jax_cache
            type: DirectoryOrCreate

        # Spack store
        - name: spack-store
          hostPath:
            path: ${ZEPHYR_BUILD_ROOT}/spack_store
            type: Directory

        # Sygaldry repo
        - name: sygaldry-repo
          hostPath:
            path: ${SYGALDRY_HOME}
            type: Directory
