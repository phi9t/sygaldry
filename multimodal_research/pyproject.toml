[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-research"
version = "0.1.0"
description = "Annotated implementations of foundational multimodal model papers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
keywords = ["deep-learning", "multimodal", "diffusion", "transformers", "vq-vae"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Core deep learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    
    # Training utilities
    "tqdm>=4.65.0",           # Progress bars
    "einops>=0.7.0",          # Tensor operations (DiT patchify)
    
    # Evaluation metrics
    "scipy>=1.10.0",          # Statistical functions for FID
    
    # Visualization for examples
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "mypy>=1.3.0",
    "ruff>=0.1.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocstrings>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/research/multimodal-research"
Repository = "https://github.com/research/multimodal-research"
Issues = "https://github.com/research/multimodal-research/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "training*", "examples*"]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
# Paper modules intentionally use numbered filenames and formula-style variable
# names (B, C, H, W) to mirror notation from source papers.
"core/0*.py" = [
    "N806",  # non-lowercase variables in function scopes
    "N812",  # torch.nn.functional as F
    "N999",  # numeric module name
    "UP006", # use built-in collection types in type hints
    "UP035", # typing imports replaced by builtins/collections.abc
]

[tool.ruff.lint.pydocstyle]
convention = "google"
