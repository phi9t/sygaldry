# tools/agentic/improvement_loop.yaml — Temporal pipeline for one improvement cycle.
#
# Invoked by run_improvement_loop.sh for each discovered issue.
#
# Required params (pass via -set flag to `go run ./cmd/orchestrate`):
#   issue_json         JSON string describing the issue (from discover_issues.py)
#   issue_title        Short title used in commit and PR (e.g. "fix SC2155 in git_ops.sh")
#   issue_type         Issue classification (e.g. shellcheck|go_vet|todo)
#   branch_name        Target branch (e.g. "agentic/..." or "main" for direct landing)
#   repo_dir           Absolute path to the repo root
#   workflow_id        Workflow ID (used to name the plan temp file)
#   implementer_engine Engine for the implement step (claude|codex|cursor|echo)
#   implementer_model  Model for the implement step (e.g. claude-sonnet-4-6)

steps:
  # ── 1. Plan ───────────────────────────────────────────────────────────────
  - id: plan
    name: Generate fix plan
    type: command
    command: python3
    args:
      - tools/agentic/generate_plan.py
      - --repo-dir
      - ${{ params.repo_dir }}
      - --workflow-id
      - ${{ params.workflow_id }}
      - --issue-json
      - ${{ params.issue_json }}
      - --failure-context-file
      - ${{ params.failure_context_file }}
    working_dir: ${{ params.repo_dir }}
    timeout_seconds: 600

  # ── 2. Prepare target branch ──────────────────────────────────────────────
  - id: branch
    name: Prepare target branch
    type: git_op
    depends_on: [plan]
    git_op:
      op: branch
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
      base_branch: main

  # ── 3. Implement ──────────────────────────────────────────────────────────
  - id: implement
    name: Implement fix
    type: agent_task
    depends_on: [branch]
    agent_task:
      engine: ${{ params.implementer_engine }}
      model: ${{ params.implementer_model }}
      prompt_file: tools/agentic/prompts/implementer.md
      working_dir: ${{ params.repo_dir }}
      sandbox: workspace-write
      params:
        issue_json: ${{ params.issue_json }}
        issue_title: ${{ params.issue_title }}
        issue_type: ${{ params.issue_type }}
        branch_name: ${{ params.branch_name }}
        repo_dir: ${{ params.repo_dir }}
        plan_file: ${{ steps.plan.outputs.plan_file }}
    timeout_seconds: 1800

  - id: verify_changes
    name: Verify implementer changed files
    type: command
    depends_on: [implement]
    allow_failure: true
    command: bash
    args:
      - -lc
      - |
        if git status --short --untracked-files=all | grep -q .; then
          exit 0
        fi
        echo "implementer produced no repository changes; skipping validate/commit" >&2
        exit 1
    working_dir: ${{ params.repo_dir }}
    timeout_seconds: 30

  # ── 4. Validate ───────────────────────────────────────────────────────────
  - id: validate
    name: Run quality gate
    type: command
    depends_on: [verify_changes]
    command: ./validate_all.sh
    args: [--quick]
    working_dir: ${{ params.repo_dir }}
    allow_failure: true
    timeout_seconds: 300

  # ── 5a. Commit (on success) ───────────────────────────────────────────────
  - id: commit_pr
    name: Commit changes
    type: git_op
    depends_on: [validate]
    when:
      step: validate
      status: success
    git_op:
      op: commit
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
      commit_message: "agentic(${{ params.issue_type }}): ${{ steps.plan.outputs.task_title }}"

  # ── 5b-i. Push branch (on success) ───────────────────────────────────────
  - id: push_branch
    name: Push branch to origin
    type: git_op
    depends_on: [commit_pr]
    when:
      step: validate
      status: success
    git_op:
      op: push
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}

  # ── 5b-ii. Open PR (on success) ──────────────────────────────────────────
  - id: create_pr
    name: Open pull request
    type: git_op
    depends_on: [push_branch]
    when:
      step: validate
      status: success
    git_op:
      op: create-pr
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
      base_branch: main
      pr_title: "agentic(${{ params.issue_type }}): ${{ steps.plan.outputs.task_title }}"
      pr_body: |
        Automated improvement generated by SAIL (Sygaldry Agentic Improvement Loop).

        Planned fix: ${{ steps.plan.outputs.task_title }}
        Original issue: ${{ params.issue_title }}

        ---
        *Generated by claude-code agentic loop — review before merging.*

  # ── 5c. Rollback (on failure) ─────────────────────────────────────────────
  - id: rollback
    name: Rollback changes
    type: git_op
    depends_on: [validate]
    when:
      step: validate
      status: failure
    git_op:
      op: reset
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
