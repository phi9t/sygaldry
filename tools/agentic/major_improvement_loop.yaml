# tools/agentic/major_improvement_loop.yaml — Temporal pipeline for one major challenge slice.

steps:
  - id: plan
    name: Plan major challenge slice
    type: agent_task
    agent_task:
      engine: ${{ params.major_planner_engine }}
      model: ${{ params.major_planner_model }}
      prompt_file: tools/agentic/prompts/major_planner.md
      working_dir: ${{ params.repo_dir }}
      sandbox: workspace-write
      params:
        issue_json: ${{ params.issue_json }}
        issue_title: ${{ params.issue_title }}
        branch_name: ${{ params.branch_name }}
        repo_dir: ${{ params.repo_dir }}
        workflow_id: ${{ params.workflow_id }}
    timeout_seconds: 1800

  - id: branch
    name: Prepare target branch
    type: git_op
    depends_on: [plan]
    git_op:
      op: branch
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
      base_branch: main

  - id: implement
    name: Implement major slice
    type: agent_task
    depends_on: [branch]
    agent_task:
      engine: ${{ params.implementer_engine }}
      model: ${{ params.implementer_model }}
      prompt_file: tools/agentic/prompts/major_implementer.md
      working_dir: ${{ params.repo_dir }}
      sandbox: workspace-write
      params:
        issue_json: ${{ params.issue_json }}
        issue_title: ${{ params.issue_title }}
        issue_type: ${{ params.issue_type }}
        branch_name: ${{ params.branch_name }}
        repo_dir: ${{ params.repo_dir }}
        plan_file: ${{ steps.plan.outputs.plan_file }}
    timeout_seconds: 2400

  - id: verify_changes
    name: Verify implementer changed files
    type: command
    depends_on: [implement]
    allow_failure: true
    command: bash
    args:
      - -lc
      - |
        if git status --short --untracked-files=all | grep -q .; then
          exit 0
        fi
        echo "implementer produced no repository changes; skipping validate/commit" >&2
        exit 1
    working_dir: ${{ params.repo_dir }}
    timeout_seconds: 30

  - id: verify_scope
    name: Check major slice scope
    type: command
    depends_on: [verify_changes]
    allow_failure: true
    command: python3
    args:
      - tools/agentic/check_major_slice_scope.py
      - --repo-dir
      - ${{ params.repo_dir }}
      - --max-files
      - ${{ params.major_max_changed_files }}
      - --max-lines
      - ${{ params.major_max_changed_lines }}
    working_dir: ${{ params.repo_dir }}
    timeout_seconds: 60

  - id: validate
    name: Run major quality gate
    type: command
    depends_on: [verify_scope]
    allow_failure: true
    command: python3
    args:
      - tools/agentic/validate_major_slice.py
      - --repo-dir
      - ${{ params.repo_dir }}
      - --issue-json
      - ${{ params.issue_json }}
    working_dir: ${{ params.repo_dir }}
    timeout_seconds: 900

  - id: commit_pr
    name: Commit changes
    type: git_op
    depends_on: [validate]
    when:
      step: validate
      status: success
    git_op:
      op: commit
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
      commit_message: "agentic(${{ params.issue_type }}): ${{ steps.plan.outputs.task_title }}"

  - id: push_branch
    name: Push branch to origin
    type: git_op
    depends_on: [commit_pr]
    when:
      step: validate
      status: success
    git_op:
      op: push
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}

  - id: create_pr
    name: Open pull request
    type: git_op
    depends_on: [push_branch]
    when:
      step: validate
      status: success
    git_op:
      op: create-pr
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
      base_branch: main
      pr_title: "agentic(${{ params.issue_type }}): ${{ steps.plan.outputs.task_title }}"
      pr_body: |
        Automated major redesign slice generated by SAIL.

        Planned slice: ${{ steps.plan.outputs.task_title }}
        Original challenge: ${{ params.issue_title }}

  - id: rollback
    name: Rollback changes
    type: git_op
    depends_on: [validate]
    when:
      step: validate
      status: failure
    git_op:
      op: reset
      repo_dir: ${{ params.repo_dir }}
      branch: ${{ params.branch_name }}
