[package]
name = "zephyr"
version = "0.1.0"
edition = "2021"
description = "Sygaldry container infrastructure CLI"
license = "MIT"

[[bin]]
name = "zephyr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
which = "7"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
serial_test = "3.3.1"
